name: FaridSmpOrderDelivery
version: '1.0.0'
main: com.faridsmp.orderdelivery.OrderDeliveryPlugin
api-version: '1.21'
author: FaridSmp
description: Polls the FaridSmp webstore for paid orders and auto-delivers ranks/keys in-game.
commands:
  fsorders:
    description: Manage/inspect FaridSmp order delivery
    usage: /fsorders <check|reload>
    permission: faridsmp.orders.admin
    permission-message: "§cKamu tidak punya izin untuk command ini."
permissions:
  faridsmp.orders.admin:
    description: Boleh pakai /fsorders (check/reload) — admin/OP saja
    default: op
