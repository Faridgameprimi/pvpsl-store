<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | FaridSmp Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="container">
            <div class="nav-left">
                <a href="index.html" class="brand-logo">FARIDSMP</a>
                <span class="server-badge">SERVER</span>
                <span class="player-badge"><span class="status-dot"></span><span class="player-count">0</span> Online</span>
            </div>
            <ul>
                <li><a href="index.html" class="sfx">Lobby</a></li>
                <li><a href="https://discord.gg/QCcnqXhhN" target="_blank" rel="noopener" class="pill-btn nav-discord sfx">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 20l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Discord
                </a></li>
                <li><a href="https://wa.me/60142446184" class="pill-btn nav-support sfx">Contact Support</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <span class="eyebrow js-server-tagline">&nbsp;</span>
        <h1 class="js-server-name">Loading…</h1>
        <p class="js-server-desc">&nbsp;</p>

        <div class="server-info-panel">
            <div class="ip-copy glass">
                <span class="ip-text js-ip-text">—</span>
                <button class="copy-btn js-copy-btn sfx" data-copy="">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy IP
                </button>
            </div>
            <a href="https://discord.gg/QCcnqXhhN" target="_blank" rel="noopener" class="pill-btn nav-discord sfx" style="padding:11px 20px !important;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 20l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Join Discord
            </a>
        </div>
    </header>

    <main class="container" id="store-app">
        <div class="tab-bar-wrap">
            <div class="tab-bar glass">
                <button type="button" class="tab-btn active" data-tab="ranks">Ranks</button>
                <button type="button" class="tab-btn" data-tab="keys">Keys</button>
            </div>
        </div>

        <div class="tab-panel active" id="panel-ranks"></div>
        <div class="tab-panel" id="panel-keys"></div>

        <div class="inventory-bar" aria-hidden="true">
            <div class="slot"></div><div class="slot lit"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot lit"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot lit"></div><div class="slot"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FaridSmp Store. Not an official Minecraft product.</p>
        <div class="footer-links">
            <a href="index.html" class="sfx">Lobby</a>
            <a href="https://discord.gg/QCcnqXhhN" class="sfx">Discord</a>
            <a href="https://wa.me/60142446184" class="sfx">WhatsApp Support</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
