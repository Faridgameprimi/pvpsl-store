<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FaridSmp</title>
    <link rel="stylesheet" href="../style.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <div class="admin-shell">
        <div class="admin-login-box glass">
            <h1>Admin Login</h1>
            <p>Masuk untuk kelola store, rank, dan key FaridSmp.</p>

            <form id="login-form">
                <div class="field">
                    <label for="admin-username">Username</label>
                    <input type="text" id="admin-username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" autocomplete="current-password" required>
                </div>
                <p class="admin-error" id="login-error"></p>
                <button type="submit" class="btn-buy sfx" id="login-btn" style="width:100%;">Login</button>
            </form>

            <p class="form-hint" style="margin-top:20px;">
                <a href="../index.html" style="color:var(--text-dim);">← Kembali ke website</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Memeriksa...';

            const username = document.getElementById('admin-username').value.trim();
            const password = document.getElementById('admin-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const json = await res.json();

                if (res.ok && json.token) {
                    sessionStorage.setItem('faridsmp_admin_token', json.token);
                    window.location.href = 'dashboard.html';
                } else {
                    errorEl.textContent = json.error || 'Username atau password salah.';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = 'Gagal hubungi server. Coba lagi.';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
